name: Deploy LUME to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate delivery app
        run: |
          test -f index.html
          test -f menu.html
          test -f produto.html
          test -f carrinho.html
          test -f checkout.html
          test -f pedido.html
          test -f pedidos.html
          test -f avaliacoes.html
          test -f favoritos.html
          node --check delivery-data.js
          node --check delivery.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
