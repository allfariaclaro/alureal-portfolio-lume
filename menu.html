<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>LUME — Cardápio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="delivery.css">
</head>
<body>
  <div data-app-header></div>
  <main class="catalog-shell">
    <div class="wrap">
      <header class="catalog-head">
        <div><h1>Cardápio</h1><p>12 itens · cozinha aberta até 23:30</p></div>
        <div class="catalog-tools">
          <select aria-label="Ordenar"><option>Mais pedidos</option><option>Menor preço</option><option>Melhor avaliados</option></select>
          <a class="secondary-btn" href="favoritos.html" style="display:flex;align-items:center;padding:0 14px">♡ Favoritos</a>
        </div>
      </header>

      <div class="category-bar" style="padding-bottom:18px">
        <button class="category-chip active" data-category-filter="all">Tudo</button>
        <button class="category-chip" data-category-filter="combos">Combos</button>
        <button class="category-chip" data-category-filter="pratos">Pratos</button>
        <button class="category-chip" data-category-filter="massas">Massas</button>
        <button class="category-chip" data-category-filter="sanduiches">Sanduíches</button>
        <button class="category-chip" data-category-filter="entradas">Entradas</button>
        <button class="category-chip" data-category-filter="sobremesas">Sobremesas</button>
        <button class="category-chip" data-category-filter="bebidas">Bebidas</button>
      </div>

      <div class="catalog-layout" data-catalog-anchor>
        <aside class="filter-panel">
          <h3>Filtros</h3>
          <div class="filter-list">
            <label><input type="checkbox"> Promoção</label>
            <label><input type="checkbox"> Mais pedidos</label>
            <label><input type="checkbox"> Vegetariano</label>
            <label><input type="checkbox"> Sem álcool</label>
            <label><input type="checkbox"> Até R$ 40</label>
          </div>
          <hr style="border:0;border-top:1px solid var(--line);margin:16px 0">
          <small style="color:var(--muted)">Use a busca no topo para encontrar por nome, ingrediente ou categoria.</small>
        </aside>
        <section class="product-grid" data-menu-catalog></section>
      </div>
    </div>
  </main>

  <div data-app-footer></div>
  <div data-app-cart></div>
  <script src="delivery-data.js"></script>
  <script src="delivery.js"></script>
</body>
</html>
